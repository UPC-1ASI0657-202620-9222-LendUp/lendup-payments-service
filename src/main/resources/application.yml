server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful
spring:
  application:
    name: lendup-payments-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3308/lendup_pagos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:lendup_pagos}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.query.fail_on_pagination_over_collection_fetch: true
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:}
    password: ${RABBITMQ_PASSWORD:}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 500ms
          multiplier: 2
          max-interval: 2s
  jackson:
    default-property-inclusion: non_null
management:
  endpoints.web.exposure.include: health
  endpoint.health:
    probes.enabled: true
    show-details: never
springdoc:
  api-docs.enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui.enabled: ${SPRINGDOC_ENABLED:false}
firebase:
  project-id: ${FIREBASE_PROJECT_ID}
lendup:
  security:
    cors-origins: ${CORS_ORIGINS:}
    swagger-public: ${SWAGGER_PUBLIC:false}
  outbox:
    relay-delay-ms: ${OUTBOX_RELAY_DELAY_MS:1000}
  reconciliation:
    delay-ms: ${PENDING_RECONCILIATION_DELAY_MS:300000}
    min-age-ms: ${PENDING_RECONCILIATION_MIN_AGE_MS:600000}
  events:
    loan-created-routing-key: ${LOAN_CREATED_ROUTING_KEY:prestamos.creado.v1}
    loan-activated-routing-key: ${LOAN_ACTIVATED_ROUTING_KEY:prestamos.activado.v1}
    loan-finished-routing-key: ${LOAN_FINISHED_ROUTING_KEY:prestamos.finalizado.v1}
    extension-accepted-routing-key: ${EXTENSION_ACCEPTED_ROUTING_KEY:prestamos.extension-aceptada.v1}
    incident-resolved-routing-key: ${INCIDENT_RESOLVED_ROUTING_KEY:evidencias.incidencia-resuelta.v1}
  integrations:
    identity:
      base-url: ${IDENTITY_SERVICE_BASE_URL:}
      service-token: ${IDENTITY_SERVICE_TOKEN:}
      firebase-user-uri-template: ${IDENTITY_FIREBASE_USER_URI_TEMPLATE:}
      connect-timeout-ms: ${IDENTITY_CONNECT_TIMEOUT_MS:2000}
      read-timeout-ms: ${IDENTITY_READ_TIMEOUT_MS:3000}
    mercado-pago:
      api-base-url: ${MERCADOPAGO_API_BASE_URL:https://api.mercadopago.com}
      access-token: ${MERCADOPAGO_ACCESS_TOKEN:}
      webhook-secret: ${MERCADOPAGO_WEBHOOK_SECRET:}
      notification-url: ${MERCADOPAGO_NOTIFICATION_URL:}
      back-url-success: ${MERCADOPAGO_BACK_URL_SUCCESS:}
      back-url-failure: ${MERCADOPAGO_BACK_URL_FAILURE:}
      back-url-pending: ${MERCADOPAGO_BACK_URL_PENDING:}
      sandbox-checkout: ${MERCADOPAGO_SANDBOX_CHECKOUT:false}
      connect-timeout-ms: ${MERCADOPAGO_CONNECT_TIMEOUT_MS:2000}
      read-timeout-ms: ${MERCADOPAGO_READ_TIMEOUT_MS:5000}
logging:
  config: classpath:logback-spring.xml
